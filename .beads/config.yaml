# Source Git stays explicit; one project-local SQL server owns task state.
issue-prefix: aos
no-git-ops: true
dolt:
    mode: server
    auto-start: false
    auto-commit: "off"
    auto-push: false
export:
    auto: false
    git-add: false
sync:
    remote: "git+https://github.com/rubber-duck/aos.git"
